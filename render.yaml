databases:
  - name: orvelia-db
    databaseName: orvelia
    user: orvelia_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: orvelia
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: "npm install && npx prisma generate && npx prisma db push --accept-data-loss"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orvelia-db
          property: connectionString
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_STORE_NAME
        value: "ORVÉLIA"
      - key: NEXT_PUBLIC_ARCHITECT_SIGNATURE
        value: "Nathan Zoua (NZ)"
      - key: PAYMENT_ACTIVE_PROVIDER
        value: "NOTCHPAY"
      - key: CSRF_PROTECTION_ENABLED
        value: "false"
